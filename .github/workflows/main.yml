name: Angular CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: formulario-ci

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas Angular
        run: npm test -- --watch=false

      - name: Construir aplicacion
        run: npm run build

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: formulario-ci/dist/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://reservas-xavier.site.je

    steps:
      - name: Descargar build
        uses: actions/download-artifact@v5
        with:
          name: angular-build
          path: dist

      - name: Subir aplicacion por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/formulario-ci/browser/
          server-dir: /htdocs/